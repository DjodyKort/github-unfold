name: Feature request
description: Suggest a new category to expand or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: input
    id: sample
    attributes:
      label: Sample GitHub page
      description: A public PR/issue that shows the thing you want expanded, if applicable.
