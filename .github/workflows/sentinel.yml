name: Sentinel

# Daily drift check against live GitHub. When a selector breaks, Claude opens a
# fix PR automatically (authenticated with a Claude subscription OAuth token, not
# a metered API key). See MAINTENANCE.md.

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch:
    inputs:
      force_heal:
        description: 'Run the healer even if no drift is detected (dry run of the AI fix)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.run.outputs.drift }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run drift sentinel
        id: run
        run: |
          set +e
          npm run sentinel
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: .sentinel/
          if-no-files-found: ignore

  heal:
    needs: sentinel
    if: needs.sentinel.outputs.drift == 'true' || inputs.force_heal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Self-heal drifted selectors with Claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            The drift sentinel detected that a GitHub DOM selector in this
            browser extension has broken. Fix it, then open a pull request.

            Context:
            - Run `npm run sentinel` to reproduce. It writes `.sentinel/report.json`
              (a list of `{ url, targetId, reason }` for each drifted target) and,
              for each failing page, `.sentinel/dom-<url>.html` containing GitHub's
              CURRENT markup.
            - The selector registry lives in `src/selectors/targets/*.ts`. Each
              `targetId` (e.g. `resolvedThreads.pr`) is a `Target` in one of those
              files. `SELECTORS.md` documents the intended anchors and gotchas.
            - Golden fixtures live in `fixtures/*.html`; unit tests in
              `tests/selectors.test.ts` assert each selector against its fixture.

            Steps for each drifted target:
            1. Read `.sentinel/report.json` and the matching `.sentinel/dom-*.html`
               to see GitHub's new structure.
            2. Update the target's `find` / `isExpanded` / `expand` / `driftHeuristic`
               in `src/selectors/targets/*.ts` to match the new markup. Prefer
               stable anchors (custom-element names, `data-*`, octicon classes,
               accessible text) over hashed CSS-module classes.
            3. Regenerate the affected `fixtures/*.html` from the captured DOM.
            4. Run `npm test` AND `npm run sentinel` until BOTH pass.
            5. Update `SELECTORS.md` if the anchor changed.

            Only commit if `npm test` and `npm run sentinel` both pass. Open a PR
            against `main` titled `[FIX] selectors: auto-heal <targetId> drift`,
            describing what GitHub changed and how the selector was updated.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Edit,Write,Bash"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
